server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          # Your Java code dynamically reads this exact block now:
          routes:
            - id: identity-public-route
              uri: http://localhost:8081
              predicates:
                 - Path=/api/v1/auth/login, /api/v1/auth/register, /api/v1/auth/verifyOtp


            - id: identity-protected-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**

# Add this property layout modification into your application.yml file
management:
  endpoints:
    web:
      exposure:
        include: "*" # Exposes all raw endpoints securely in local dev
  endpoint:
    gateway:
      enabled: true # Explicitly force the gateway actuator endpoint component to hot-wire

eureka:
  client:
    enabled: false

jwt:
  secret: dGhpcy1pcy1hLXNlY3VyvS0yNTYtYml0udgh9fJldC1rZXktZm9yLWFsbHRpbWUtYXBwbGljYXRpb42
